services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "PramosClearing_Pass123!"
      MSSQL_PID: "Express"
      MSSQL_MEMORY_LIMIT_MB: "1500"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    deploy:
      resources:
        limits:
          memory: 1536m
    healthcheck:
      test:
        [
          "CMD",
          "/opt/mssql-tools18/bin/sqlcmd",
          "-S", "localhost",
          "-U", "sa",
          "-P", "PramosClearing_Pass123!",
          "-Q", "SELECT 1",
          "-No",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  timescaledb:
    image: timescale/timescaledb:2.18.2-pg16
    command: postgres -c shared_buffers=128MB -c work_mem=4MB -c maintenance_work_mem=32MB -c max_connections=30
    environment:
      POSTGRES_DB: PramosClearing_MarketData
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      - ./infra/db/timescaledb:/docker-entrypoint-initdb.d:ro
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d PramosClearing_MarketData"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  market-service:
    build:
      context: ./services/market-service
      dockerfile: Dockerfile
    ports:
      # porta de host dinâmica (necessário para permitir múltiplas réplicas
      # sem conflito de bind). Use `docker compose port market-service 8080`
      # para descobrir a porta atribuída, ou coloque um proxy na frente.
      - "8080"
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=PramosClearing_Market;User Id=sa;Password=PramosClearing_Pass123!;TrustServerCertificate=True;
      - ConnectionStrings__TimescaleConnection=Host=timescaledb;Port=5432;Database=PramosClearing_MarketData;Username=postgres;Password=postgres
      - Kafka__BootstrapServers=kafka:9092
      - Kafka__Topic=orderbook-updates
      - Kafka__GroupId=market-price-tick-consumer
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 384m
    depends_on:
      sqlserver:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      kafka:
        condition: service_healthy

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    ports:
      - "5002:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=PramosClearing_Users;User Id=sa;Password=PramosClearing_Pass123!;TrustServerCertificate=True;
    depends_on:
      sqlserver:
        condition: service_healthy

  orderbook-simulator:
    build:
      context: ./workers/orderbook-simulator
      dockerfile: Dockerfile
    environment:
      - ConnectionStrings__MarketConnection=Server=sqlserver,1433;Database=PramosClearing_Market;User Id=sa;Password=PramosClearing_Pass123!;TrustServerCertificate=True;
      - Simulation__MinDelayMs=20
      - Simulation__MaxDelayMs=100
      - Kafka__BootstrapServers=kafka:9092
      - Kafka__Topic=orderbook-updates
    deploy:
      resources:
        limits:
          memory: 256m
    depends_on:
      market-service:
        condition: service_started
      kafka:
        condition: service_healthy

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_HEAP_OPTS: "-Xms64m -Xmx192m"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    deploy:
      resources:
        limits:
          memory: 256m
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'cat < /dev/null > /dev/tcp/localhost/2181'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    ports:
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    deploy:
      resources:
        limits:
          memory: 768m
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: pramos-clearing
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      JAVA_OPTS: "-Xms64m -Xmx192m"
    deploy:
      resources:
        limits:
          memory: 256m
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  sqlserver-data:
  timescaledb-data:
  zookeeper-data:
  zookeeper-logs:
  kafka-data: